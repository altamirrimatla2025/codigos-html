<!doctype html>
<html lang="pt-br" >
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title> MEU SITE - login</title>
<link rel="stylesheet" href="./style.css">
</head>

<body>
<div class="container">
    <div class="logo">
        <span>MINHA HORTA</span>
    </div>
<h1>BEM-VINDO AO MEU SITE</h1>
<P>FAÇA LOGIN PARA CONTINUAR</P>
<!-- FORMULARIO DE LOGIN -->
<form action="home.html" method="post" class="login-form">
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="seuemail@gmail.com" required>
    <label for="senha">Senha:</label>
    <input type="password" id="senha" name="senha" placeholder="digite sua senha" required>
    

    <button type="submit" class="btn-login">ENTRAR</button>
</form>

<!-- LINK PARA A PAGINA DE CADASTRO -->
<div class="cadastro-link">
    <p>NÃO TEM UMA CONTA? </p>
    <a href="cadastro.html" class="btn-cadastro">CRIAR CONTA</a>
</div>
</div>
</body>
</html>
